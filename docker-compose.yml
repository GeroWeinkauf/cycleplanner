# ──────────────────────────────────────────────
# CyclePlanner – Docker Compose Verbund
# ──────────────────────────────────────────────

services:
  # ── Valhalla Routing Engine ─────────────────
  # Intern, NIE nach außen veröffentlicht.
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    volumes:
      - ./data/custom_files:/custom_files
      # Runtime config overrides the auto-generated one
      - ./config/valhalla.json:/custom_files/valhalla.json
    environment:
      - use_tiles_ignore_pbf=True
      - server_threads=${VALHALLA_SERVER_THREADS:-4}
      - build_elevation=False
      - build_admins=False
      - build_time_zones=False
      - build_tar=False
    # Kein "ports:" – Valhalla ist nur im internen Netz erreichbar.
    expose:
      - "8002"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8002/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Valhalla Graph Build (Profil "build") ───
  # docker compose --profile build up valhalla-build
  valhalla-build:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    profiles: ["build"]
    volumes:
      - ./data/custom_files:/custom_files
    environment:
      - build_elevation=True
      - build_admins=True
      - build_time_zones=False
      - build_tar=True
      - server_threads=${VALHALLA_SERVER_THREADS:-4}
    ports:
      - "127.0.0.1:8002:8002"
    restart: "no"

  # ── Backend API ─────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      - VALHALLA_URL=http://valhalla:8002
      - API_PORT=${API_PORT:-3000}
      - API_HOST=0.0.0.0
    ports:
      - "${HOST_BIND:-127.0.0.1}:${API_PORT:-3000}:3000"
    depends_on:
      valhalla:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── Caddy Reverse Proxy ─────────────────────
  web:
    image: caddy:2-alpine
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/web/dist:/srv:ro
    environment:
      - CADDY_PORT=${CADDY_PORT:-8080}
      - API_PORT=${API_PORT:-3000}
    ports:
      - "${HOST_BIND:-127.0.0.1}:${CADDY_PORT:-8080}:${CADDY_PORT:-8080}"
    depends_on:
      - api
    restart: unless-stopped
